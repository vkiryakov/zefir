name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The names of `test`, `tsan` and `fmt` are required status checks on
  # main and dev; keep them in sync.
  test:
    name: test (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Zig version is taken from minimum_zig_version in build.zig.zon.
      - uses: mlugg/setup-zig@v2
      # A test that hangs fails after 5 minutes, by name and with its
      # stderr, and the other tests still run. Without the flag the job
      # would hit its timeout and print nothing about the test.
      - run: zig build test --summary all --test-timeout 5m

  # The tests again under ThreadSanitizer; it does not build for Windows.
  tsan:
    name: tsan (${{ matrix.os }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
      # TSan maps its shadow memory at fixed addresses, which the mmap
      # randomness of recent Ubuntu kernels can take.
      - if: runner.os == 'Linux'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - run: zig build test -Dtsan=true --summary all --test-timeout 5m

  # The validator's tests built, not run, for a 32-bit target, where usize
  # has 32 bits; the other jobs build for 64-bit targets only.
  validator-x86:
    name: validator (x86-linux-musl, compile only)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
      - run: zig build compile-validator-tests -Dtarget=x86-linux-musl --summary all

  fmt:
    name: fmt
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
      - run: zig fmt --check build.zig build.zig.zon src tests

  # The end-to-end tests of nats against NATS servers in Docker. Only the
  # Linux runners run Linux containers, so this job is ubuntu only. It is
  # not a required check yet.
  nats-e2e:
    name: nats-e2e
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
      - name: Start the NATS servers
        run: docker compose --file tests/nats/docker-compose.yml up --detach --wait
      - name: Run the end-to-end tests
        working-directory: tests/nats
        timeout-minutes: 10
        run: zig build e2e --summary all
      - name: Stop the NATS servers
        if: always()
        run: docker compose --file tests/nats/docker-compose.yml down
