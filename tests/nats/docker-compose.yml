# The NATS servers of the end-to-end tests. `zig build e2e` starts them and
# waits until they are healthy; `zig build down` stops them. Every port is
# published on 127.0.0.1 only:
#
#   14222  plain, no authentication
#   14223  users and passwords (conf/auth.conf)
#   14224  TLS required
#   14225  TLS first: no INFO before the TLS handshake
#   14226  cluster node a, 14227 node b, 14228 node c
#
# certs/ holds a self-signed certificate for the TLS servers, valid for 100
# years. The client does not do TLS; the servers need it to start.

name: zefir-nats-e2e

x-nats: &nats
  image: nats:2.15.0-alpine
  volumes:
    - ./conf:/conf:ro
    - ./certs:/certs:ro
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
    interval: 1s
    timeout: 2s
    retries: 30

services:
  plain:
    <<: *nats
    command: ["--config", "/conf/plain.conf"]
    ports: ["127.0.0.1:14222:4222"]

  auth:
    <<: *nats
    command: ["--config", "/conf/auth.conf"]
    ports: ["127.0.0.1:14223:4222"]

  tls:
    <<: *nats
    command: ["--config", "/conf/tls.conf"]
    ports: ["127.0.0.1:14224:4222"]

  tls-first:
    <<: *nats
    command: ["--config", "/conf/tls-first.conf"]
    ports: ["127.0.0.1:14225:4222"]

  cluster-a:
    <<: *nats
    command: ["--config", "/conf/cluster-a.conf"]
    ports: ["127.0.0.1:14226:4222"]

  cluster-b:
    <<: *nats
    command: ["--config", "/conf/cluster-b.conf"]
    ports: ["127.0.0.1:14227:4222"]

  cluster-c:
    <<: *nats
    command: ["--config", "/conf/cluster-c.conf"]
    ports: ["127.0.0.1:14228:4222"]
