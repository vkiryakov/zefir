# Node b of a three-node cluster. Clients reach it on 127.0.0.1:14227, and
# the cluster announces it so in connect_urls.
port: 4222
http_port: 8222
server_name: b
client_advertise: "127.0.0.1:14227"
cluster {
  name: zefir
  listen: "0.0.0.0:6222"
  routes: ["nats://cluster-a:6222", "nats://cluster-b:6222", "nats://cluster-c:6222"]
}
# The shortest lame duck the server takes, with a short grace period.
lame_duck_duration: "30s"
lame_duck_grace_period: "2s"
