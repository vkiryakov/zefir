# Users and passwords; "limited" may not use some subjects, "noinbox" may
# not subscribe to an inbox.
port: 4222
http_port: 8222
authorization {
  users: [
    { user: "alice", password: "secret" }
    { user: "carol", password: "p\"w\\d-пароль-ü" }
    {
      user: "limited"
      password: "limited"
      permissions: {
        publish: { deny: ["secret.>"] }
        subscribe: { deny: ["forbidden", "forbidden.>"] }
      }
    }
    # May not subscribe to any inbox: no request of its can get a reply.
    {
      user: "noinbox"
      password: "noinbox"
      permissions: {
        subscribe: { deny: ["_INBOX.>"] }
      }
    }
  ]
}
