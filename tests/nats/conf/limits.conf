# An account with a lower max_payload than the server's 1 MiB: its user
# "small" may publish messages of 1024 bytes at most, headers included.
# nats-server tells the client so in an INFO right after the PONG to its
# first PING.
port: 4222
http_port: 8222
accounts {
  SMALL {
    users: [
      { user: "small", password: "small" }
    ]
    limits {
      max_payload: 1024
    }
  }
}
