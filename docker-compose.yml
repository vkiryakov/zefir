# The NATS servers of the end-to-end tests of nats, in tests/nats, and of
# rpc-nats, in tests/rpc-nats. From here, `docker compose up -d --wait`
# starts them and waits until they are healthy, and `docker compose down`
# stops them; in tests/nats and tests/rpc-nats, `zig build e2e` starts them
# too and `zig build down` stops them. Every port is published on
# 127.0.0.1 only:
#
#   14222  plain, no authentication
#   14223  users and passwords (tests/nats/conf/auth.conf)
#   14224  TLS required
#   14225  TLS first: no INFO before the TLS handshake
#   14226  cluster node a, 14227 node b, 14228 node c
#   14229  plain, for tests that pause it: a server that stops reading
#   14230  plain, for tests that stop and start it
#   14231  a user whose password tests change and reload
#   14232  a user whose account has a lower max_payload than the server's
#   14233  the NATS permissions of rpc services (tests/rpc-nats/conf/acl.conf)
#
# tests/nats/certs holds a self-signed certificate for the TLS servers, valid
# for 100 years. The client does not do TLS; the servers need it to start.
#
# nats-box, in the profile `tools`, is the NATS CLI that the tests of
# rpc-nats run against the servers, by their service names:
# `docker compose run --rm nats-box nats -s nats://plain:4222 micro ls`.
#
# The MongoDB servers of the end-to-end tests of zefir-mongo, in
# tests/mongo, are in the profile `mongo`, so that `up` and `down` without
# it, as the NATS tests run them, leave them alone:
# `docker compose --profile mongo up -d --wait mongo-plain` starts them,
# and so does `zig build e2e` there. MONGO_VERSION picks the image of
# mongo, 9.0.4 by default; CI also runs 7.0.45 and 8.0.34. Each starts
# with an empty database. Their ports, on 127.0.0.1 only:
#
#   27117  mongo-plain: no authentication, test commands on for fail points
#   27118  mongo-auth: --auth with the users of tests/mongo/init/users.js,
#          test commands on
#   27119  mongo-stall: no authentication, for tests that pause it: a
#          server that takes commands and answers none
#   27120  mongo-restart: no authentication, test commands on, for tests
#          that restart it
#   27121  mongo-ghost: a member of the replica set "ghost" that is never
#          initialized (RSGhost), for the native driver to refuse

name: zefir-nats-e2e

x-nats: &nats
  image: nats:2.15.0-alpine
  volumes:
    - ./tests/nats/conf:/conf:ro
    - ./tests/nats/certs:/certs:ro
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
    interval: 1s
    timeout: 2s
    retries: 30

x-mongo: &mongo
  image: mongo:${MONGO_VERSION:-9.0.4}
  profiles: ["mongo"]
  # In memory: every start has an empty database, and no volume is left.
  tmpfs: ["/data/db", "/data/configdb"]
  healthcheck:
    test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
    interval: 1s
    timeout: 5s
    retries: 60

services:
  plain:
    <<: *nats
    # The tests read its monitoring endpoint by this name.
    container_name: zefir-nats-e2e-plain
    command: ["--config", "/conf/plain.conf"]
    ports: ["127.0.0.1:14222:4222"]

  auth:
    <<: *nats
    command: ["--config", "/conf/auth.conf"]
    ports: ["127.0.0.1:14223:4222"]

  tls:
    <<: *nats
    command: ["--config", "/conf/tls.conf"]
    ports: ["127.0.0.1:14224:4222"]

  tls-first:
    <<: *nats
    command: ["--config", "/conf/tls-first.conf"]
    ports: ["127.0.0.1:14225:4222"]

  # The tests stop nodes, and send them into lame duck mode, by these
  # names.
  cluster-a:
    <<: *nats
    container_name: zefir-nats-e2e-cluster-a
    command: ["--config", "/conf/cluster-a.conf"]
    ports: ["127.0.0.1:14226:4222"]

  cluster-b:
    <<: *nats
    container_name: zefir-nats-e2e-cluster-b
    command: ["--config", "/conf/cluster-b.conf"]
    ports: ["127.0.0.1:14227:4222"]

  cluster-c:
    <<: *nats
    container_name: zefir-nats-e2e-cluster-c
    command: ["--config", "/conf/cluster-c.conf"]
    ports: ["127.0.0.1:14228:4222"]

  # The tests pause and unpause it by this name.
  stall:
    <<: *nats
    container_name: zefir-nats-e2e-stall
    command: ["--config", "/conf/plain.conf"]
    ports: ["127.0.0.1:14229:4222"]

  # The tests stop and start it by this name.
  restart:
    <<: *nats
    container_name: zefir-nats-e2e-restart
    command: ["--config", "/conf/plain.conf"]
    ports: ["127.0.0.1:14230:4222"]

  # It runs from a copy of reload.conf, made afresh at every start; the
  # tests overwrite the copy and reload it with SIGHUP.
  reload:
    <<: *nats
    container_name: zefir-nats-e2e-reload
    entrypoint: ["sh", "-c", "cp /conf/reload.conf /tmp/nats.conf && exec nats-server --config /tmp/nats.conf"]
    ports: ["127.0.0.1:14231:4222"]

  # The tests stop and start it by this name.
  limits:
    <<: *nats
    container_name: zefir-nats-e2e-limits
    command: ["--config", "/conf/limits.conf"]
    ports: ["127.0.0.1:14232:4222"]

  # The permissions of the guide of rpc-nats: each service its own user.
  rpc-acl:
    <<: *nats
    volumes:
      - ./tests/rpc-nats/conf:/conf:ro
    command: ["--config", "/conf/acl.conf"]
    ports: ["127.0.0.1:14233:4222"]

  # The NATS CLI, run on demand: `docker compose run --rm nats-box nats ...`.
  nats-box:
    image: natsio/nats-box:0.20.0
    profiles: ["tools"]

  # enableTestCommands lets the tests set fail points (failCommand).
  mongo-plain:
    <<: *mongo
    command: ["mongod", "--setParameter", "enableTestCommands=1"]
    ports: ["127.0.0.1:27117:27017"]

  # The image makes the users of init/users.js at every start, on a
  # temporary mongod without --auth that listens on 127.0.0.1 of the
  # container only. The healthcheck waits for the mongod after it: a
  # command without a user must be refused (code 13), as only --auth does.
  mongo-auth:
    <<: *mongo
    command: ["mongod", "--auth", "--setParameter", "enableTestCommands=1"]
    volumes:
      - ./tests/mongo/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:27118:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "let r; try { r = db.adminCommand({ listDatabases: 1 }) } catch (e) { r = e } quit(r.code === 13 ? 0 : 1)"]
      interval: 1s
      timeout: 5s
      retries: 60

  # The tests pause and unpause it by this name.
  mongo-stall:
    <<: *mongo
    container_name: zefir-mongo-e2e-stall
    ports: ["127.0.0.1:27119:27017"]

  # The tests restart it by this name, with calls out that sleep on it.
  mongo-restart:
    <<: *mongo
    container_name: zefir-mongo-e2e-restart
    command: ["mongod", "--setParameter", "enableTestCommands=1"]
    ports: ["127.0.0.1:27120:27017"]

  # A member of a replica set without rs.initiate(): its hello says
  # isreplicaset, and the native driver refuses it.
  mongo-ghost:
    <<: *mongo
    command: ["mongod", "--replSet", "ghost"]
    ports: ["127.0.0.1:27121:27017"]
